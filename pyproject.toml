[project]
name = "plutusai-backend"
version = "0.1.0"
description = "PlutusAI backend: Django + DRF monolith (foundation + manual portfolio workflow)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.16",
    "django-cors-headers>=4.4,<5",
    "dj-database-url>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "yfinance>=0.2.65,<2",
    "requests>=2.32,<3",
    "pandas>=2.2,<4",
]

[tool.setuptools]
py-modules = []
